<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خلل في الشاشة</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#050505;color:#00ffff;
font-family:monospace;min-height:100vh;
display:flex;align-items:center;justify-content:center;
overflow:hidden;animation:flicker .12s infinite;
}
.box{text-align:center;padding:20px;animation:shake .15s infinite}
h1{font-size:clamp(32px,9vw,70px);color:#ff00ff;
text-shadow:4px 0 cyan,-4px 0 red;animation:glitch .25s infinite}
p{font-size:20px;color:white}
.lines{position:fixed;inset:0;pointer-events:none;
background:repeating-linear-gradient(transparent 0 3px,#ffffff12 4px 5px)}
@keyframes shake{0%{transform:translate(2px,-1px)}50%{transform:translate(-3px,2px)}100%{transform:translate(1px,1px)}}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.75}}
@keyframes glitch{0%{transform:translate(2px,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-1px,1px)}}
</style>
</head>
<body>
<div class="box">
<h1>⚠ خلل في الشاشة ⚠</h1>
<p> SYSTEM ERROR_404</p>
<p> جاري اختراق النظام...</p>
<p> █▓▒░ SIGNAL LOST ░▒▓█</p>
</div>
<div class="lines"></div>
</body>
</html>
